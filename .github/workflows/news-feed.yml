# 各社の RSS を1時間ごとに取得し、news.json を news-data ブランチに置く。
# アプリは https://raw.githubusercontent.com/velqiron/news-globe/news-data/news.json を読む。
# news-data は履歴を持たない1コミットだけのブランチ（毎回作り直して強制 push）。
name: news-feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install babel (country names in 12 languages)
        run: pip install babel==2.18.0

      - name: Get previous news.json
        run: |
          mkdir -p out
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/news-data/news.json" -o out/prev.json || echo '{}' > out/prev.json

      - name: Fetch feeds
        run: python3 tools/fetch_news.py --feeds tools/feeds.json --html news-globe.html --prev out/prev.json --out out/news.json

      - name: Publish to news-data branch
        run: |
          cd out
          rm -f prev.json
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "news.json $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" news-data
